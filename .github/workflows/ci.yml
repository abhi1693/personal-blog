name: CI
on:
  push:
    branches:
      - master
  pull_request: null
  schedule:
    - cron: 0 0 * * *
env:
  DO_NOT_TRACK: '1'
permissions:
  contents: read
jobs:
  build:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@v1
    with:
      checks: '["lint", "typecheck", "test", "build"]'
      scripts: '{"lint": "lint", "typecheck": "typecheck", "test": "test", "build": "build"}'
      timeout-minutes: 20
      runs-on: ubuntu-latest
      node-version-file: .nvmrc
      ignore-scripts: true
      project-env: '{"DO_NOT_TRACK":"1","NEXT_GOOGLE_ADSENSE_ID":${{ toJSON(vars.NEXT_GOOGLE_ADSENSE_ID) }},"NEXT_GOOGLE_ANALYTICS_ID":${{ toJSON(vars.NEXT_GOOGLE_ANALYTICS_ID) }},"NEXT_GOOGLE_TAG_MANAGER_ID":${{ toJSON(vars.NEXT_GOOGLE_TAG_MANAGER_ID) }},"NEXT_PUBLIC_BASE_URL":${{ toJSON(vars.NEXT_PUBLIC_BASE_URL) }},"NEXT_PUBLIC_SANITY_API_VERSION":${{ toJSON(vars.NEXT_PUBLIC_SANITY_API_VERSION) }},"NEXT_PUBLIC_SANITY_DATASET":${{ toJSON(vars.NEXT_PUBLIC_SANITY_DATASET) }},"NEXT_PUBLIC_SANITY_PROJECT_ID":${{ toJSON(vars.NEXT_PUBLIC_SANITY_PROJECT_ID) }}}'
    secrets:
      project-env: '{"BLOG_GITHUB_TOKEN":${{ toJSON(secrets.GITHUB_TOKEN) }},"SANITY_API_READ_TOKEN":${{ toJSON(secrets.SANITY_API_READ_TOKEN) }}}'
    if: github.event_name != 'schedule'
  runtime-image:
    name: Native ARM64 runtime
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/runtime-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: false
    secrets:
      sanity-read-token: ${{ secrets.SANITY_API_READ_TOKEN }}
  submit_sitemap:
    runs-on: ubuntu-latest
    if:
      ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.result == 'success') ||
      github.event_name == 'schedule') }}
    needs:
      - build
    env:
      GOOGLE_SVC_ACCOUNT: ${{ secrets.GOOGLE_SVC_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Decode and store Google Service Account JSON
        run: echo "${{ secrets.GOOGLE_SVC_ACCOUNT }}" | base64 -d > scripts/service-account.json
      - name: Submit Sitemap
        run: node scripts/sitemap-to-google
      - name: Submit to IndexNow
        env:
          LASTMOD_THRESHOLD_DAYS: 1
        run: node scripts/indexnow.js
