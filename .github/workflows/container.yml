name: Container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version matching package.json; run only on its exact VERSION tag
        required: true

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/runtime-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: true
      version: ${{ inputs.version || github.event.release.tag_name }}
    secrets:
      sanity-read-token: ${{ secrets.SANITY_API_READ_TOKEN }}
